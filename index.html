<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A browser-based alien shooter with 50 escalating waves, Mothership bosses, pilot upgrades and unlockable ships.">
  <title>Alien Shooter</title>
  <link rel="stylesheet" href="css/style.css?v=seasonal-chest">
  <script defer src="js/data.js?v=game-audit-1128"></script>
  <script defer src="js/game.js?v=game-audit-1128"></script>
  <script defer src="js/expansion.js?v=game-audit-1128"></script>
  <script defer src="js/quests.js?v=game-audit-1128"></script>
  <script defer src="js/flight-view.js?v=seasonal-chest"></script>
  <script defer src="js/admin.js?v=seasonal-chest"></script>
  <script defer src="js/armory.js?v=game-audit-1128"></script>
  <script defer src="js/changelog.js?v=game-audit-1128"></script>
  <script defer src="js/main.js?v=game-audit-1128"></script>
</head>
<body>
  <main class="console">
    <header class="top">
      <a class="brand" href="./index.html" aria-label="Alien Shooter home"><span id="brand-ship" class="mark" aria-hidden="true"></span> ALIEN<span class="brand-end">/SHOOTER</span></a>
      <div class="console-actions">
        <button id="settings" class="quiet" type="button"><img class="menu-icon" src="new-icons/vector-icon-pack/General/Settings/Gear%20256.png" alt="">Settings</button>
        <button id="admin" class="quiet" type="button">Admin</button>
        <button id="sound" class="quiet" type="button" aria-pressed="false">Sound off</button>
      </div>
    </header>
    <div class="quest-anchor" hidden id="quest-anchor">
      <button type="button" id="quest-toggle" aria-expanded="false" aria-controls="quest-panel"><img class="menu-icon" src="new-icons/vector-icon-pack/General/Clipboard/Clipboard%20256.png" alt="">Quests</button>
      <aside id="quest-panel" class="quest-panel" aria-label="Daily quests" hidden></aside>
    </div>
    <div id="flight-layout" class="flight-layout">
    <section class="stage" aria-label="Flight deck">
      <canvas id="sky" width="900" height="600" aria-label="Alien Shooter playfield"></canvas>
      <div id="combat-rim" class="combat-rim" hidden aria-hidden="true"></div>
      <div id="wave-actions" class="wave-actions" hidden>
        <button id="skip" type="button" aria-label="Skip wave" title="Skip wave"><span aria-hidden="true">⏩︎</span></button>
        <button id="auto" type="button" aria-label="Auto Skip" aria-pressed="false"><span aria-hidden="true">⟳</span></button>
      </div>
      <button id="hud-toggle" class="hud-toggle" type="button" aria-label="Hide top menu" aria-pressed="false" hidden>▾</button>
      <div id="hud" class="hud" hidden>
        <div class="health-hud"><span class="label">HEALTH</span>
          <div class="health-meter"><progress id="hull" aria-label="Health" max="100"></progress><strong id="hull-value"></strong></div>
        </div>
        <div class="wave-hud"><span class="label">WAVE</span><strong id="wave"></strong></div>
        <div><span class="label">PILOT <span id="level"></span></span><progress id="xp" aria-label="Pilot experience" max="100"></progress></div>
        <div id="energy-hud" class="energy"><span class="label">ENERGY <span id="energy-value">0%</span></span><progress id="energy" aria-label="Ship energy" max="100"></progress></div>
        <div><span class="label">SCORE</span><strong id="score"></strong></div>
        <div class="wallet"><span title="Credits"><img src="icons/currency/credit_gold.png" alt="Credits"> <b id="credits"></b></span><span title="Star Gems"><img src="icons/currency/star_gem.png" alt="Star Gems"> <b id="gems"></b></span></div>
      </div>
      <div id="boss" class="boss" hidden>
        <span class="label" id="boss-name"></span>
        <span class="boss-hp" id="boss-hp"></span>
        <progress id="boss-health" aria-label="Boss health"></progress>
      </div>
      <div id="boosts" class="boosts" hidden></div>
      <div id="ship-ability" class="ship-ability" hidden></div>
      <aside id="side-notices" class="side-notices" aria-live="polite"></aside>
      <p id="alert" class="alert" role="status" hidden></p>
      <div id="wave-message" class="wave-message" hidden></div>
      <div id="overlay" class="overlay">
        <section id="home" class="screen home" aria-labelledby="title">
          <aside class="home-wallet" aria-label="Currency balances">
            <div><img src="icons/currency/credit_gold.png" alt=""><span>Credits</span><strong id="home-credits">0</strong></div>
            <div><img src="icons/currency/star_gem.png" alt=""><span>Star Gems</span><strong id="home-gems">0</strong></div>
          </aside>
          <aside id="update-banner" class="update-banner" data-theme="trails">
            <img class="menu-icon update-icon trails-icon" src="new-icons/vector-icon-pack/Items/Wing/Wing%20256.png" alt="">
            <img class="menu-icon update-icon token-icon" src="icons/ui/alien_token.svg" alt="">
            <img class="menu-icon update-icon christmas-icon" src="new-icons/vector-icon-pack/Holiday/Christmas%20Tree/Christmas%20Tree%20256.png" alt="">
            <div><strong id="update-title">Trails Update</strong><time id="update-time" datetime="2026-11-28T22:53:00+11:00">10:53 p.m.</time></div>
            <img class="christmas-sprig" src="new-icons/vector-icon-pack/Holiday/Holly/Holly%20256.png" alt="">
            <img class="christmas-cane" src="new-icons/vector-icon-pack/Holiday/Candy%20Cane/Candy%20Cane%20256.png" alt="">
          </aside>
          <aside class="event-banner"><strong><img class="menu-icon" src="new-icons/vector-icon-pack/Transport/UFO/UFO%20256.png" alt="">Alien Event</strong><span id="event-time"></span></aside>
          <h1 id="title">ALIEN<br><em>SHOOTER</em></h1>
          <div class="launch-options">
            <button id="continue" class="primary" hidden>Continue run</button>
            <button id="launch" class="primary">Launch <span aria-hidden="true">↗</span></button>
          </div>
          <div class="home-actions">
            <button id="hangar-open"><img class="menu-icon" src="new-icons/vector-icon-pack/Transport/Rocket/Rocket%20256.png" alt="">Hangar</button>
            <button id="inventory-home"><img class="menu-icon" src="new-icons/vector-icon-pack/Clothing/Backpack/Backpack%20256.png" alt="">Inventory</button>
            <button id="craft-open"><img class="menu-icon" src="new-icons/vector-icon-pack/Tools/Hammer/Hammer%20256.png" alt="">Crafting</button>
            <button id="shop-open"><img class="menu-icon" src="new-icons/vector-icon-pack/General/Shopping%20Basket/Shopping%20Basket%20Green%20256.png" alt="">Shop</button>
            <button id="merchant-open"><img class="menu-icon" src="new-icons/vector-icon-pack/General/Shopping%20Basket/Shopping%20Basket%20Purple%20256.png" alt="">Merchant</button>
            <button id="outfit-open"><img class="menu-icon" src="new-icons/vector-icon-pack/Tools/Wrench/Wrench%20256.png" alt="">Ship Loadout</button>
          </div>
          <p id="record" class="record" hidden></p>
        </section>
        <section id="panel" class="screen panel" aria-labelledby="panel-title" hidden>
          <div class="panel-head"><h2 id="panel-title"></h2><button id="close" class="close" aria-label="Close">×</button></div>
          <p id="panel-note" class="panel-note" hidden></p>
          <div id="panel-body"></div>
        </section>
      </div>
    </section>
      <aside id="boost-dock" class="boost-dock" aria-label="Flight items" hidden>
        <button id="flight-boost-0" type="button" aria-label="Item slot 1"></button>
        <button id="flight-boost-1" type="button" aria-label="Item slot 2"></button>
        <button id="flight-boost-2" type="button" aria-label="Item slot 3"></button>
        <button id="relay-toggle" type="button" aria-label="Auto Boost" aria-pressed="false" hidden>Auto</button>
      </aside>
    </div>
    <section id="controls" class="controls" aria-label="Flight controls" hidden>
      <div class="completion"><span class="label">WAVE PROGRESS <b id="completion-value"></b></span><progress id="completion" aria-label="Wave completion" max="100"></progress></div>
      <button id="supplies"><img id="supply-icon" alt=""><span id="supply-label">Supplies · Lv 5</span></button>
      <label id="target-control" class="target-control" hidden>Target <select id="target-mode" aria-label="Missile targeting">
        <option value="nearest">Closest to ship</option><option value="bottom">Closest to bottom</option>
        <option value="strongest">Strongest</option><option value="weakest">Weakest</option>
      </select></label>
      <button id="laser-toggle" type="button" aria-pressed="false" hidden>Laser</button>
      <div id="alien-actions" class="flight-actions" hidden>
        <span id="mind-countdown" class="mind-countdown"></span>
        <button id="mind-toggle" type="button" aria-pressed="false" hidden>Mind control</button>
      </div>
      <button id="pause">Pause</button>
    </section>
  </main>
<div id="loot-strip" class="loot-strip" aria-live="polite"></div>
</body>
</html>
